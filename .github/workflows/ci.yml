name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jsonsui.slnx

      - name: Build
        run: dotnet build Jsonsui.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Jsonsui.slnx -c Release --no-build
